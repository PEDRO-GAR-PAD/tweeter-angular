<!-- login-card.component.html -->
<div class="login-card">
  <h2>Login</h2>
  <form (ngSubmit)="callLogin()">
    <div class="form-row">
      <label for="email">Usuario</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="tu@correo.com"
        required
      />
    </div>
    <div class="form-row">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="••••••••"
        required
      />
    </div>
    <div class="form-actions">
      <button type="submit">Entrar</button>
      <a routerLink="/">Cancelar</a>
    </div>
    <div class="form-links">
      <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      <span>•</span>
      <a routerLink="/newuser">Crear cuenta</a>
    </div>
  </form>
</div>
