<!-- new-user-form.component.html -->
<div class="new-user-form">
  <h2>Crear cuenta</h2>
  <form (ngSubmit)="register()">
    <div class="field-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="myNewUser.email"
        name="email"
        placeholder="tu@correo.com"
        required
      />
    </div>

    <div class="field-group">
      <label for="username">Usuario</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="myNewUser.username"
        name="username"
        placeholder="Usuario"
        required
      />
    </div>

    <div class="field-group">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="myNewUser.password"
        name="password"
        placeholder="tucontraseña"
        required
      />
    </div>

    <button type="submit" class="btn-submit">Crear cuenta</button>
  </form>

  <p *ngIf="message" class="info">{{ message }}</p>
  <a routerLink="/login" class="link-back">← Volver al login</a>
</div>
